name: daily-news
on:
  schedule:
    - cron: "30 22 * * *" # 05:00 Yangon
    - cron: "30 10 * * *" # 17:00 Yangon
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "daily news" || exit 0
          git push
